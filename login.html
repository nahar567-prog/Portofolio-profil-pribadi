<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catatan Belajar | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Catatan Belajar<span>.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="catatan.html">Catatan</a></li>
          <li class="nav-item"><a class="nav-link" href="progres.html">Progres</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="judul-halaman">
    <div class="container">
      <h1 class="h2 fw-semibold">Login</h1>
      <p>Masuk untuk membuka halaman catatan.</p>
    </div>
  </div>

  <main class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="kartu">

          <!-- pesan error atau sukses muncul di sini -->
          <div id="pesan"></div>

          <form id="formLogin" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="nama@email.com">
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Minimal 8 karakter">
            </div>
            <button type="submit" class="btn btn-koral w-100 py-2">Login</button>
          </form>

          <p class="text-muted small text-center mt-3 mb-0">Ini hanya validasi form di browser, belum terhubung ke database.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center">
    <small>&copy; 2026 Naharuddin - Tugas UTS Pemrograman Web</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
